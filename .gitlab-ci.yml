image: python:3.14

before_script:
  - pip install scons

variables:
  GODOT_CPP_PATH: godot-cpp
  GIT_SUBMODULE_STRATEGY: recursive

cache:
  key:
    files:
      - .gitmodules
      - $GODOT_CPP_PATH/.git/HEAD
  paths:
    - $GODOT_CPP_PATH/bin/

build_project:
  stage: build
  script:
    - cd $GODOT_CPP_PATH
    - scons platform=linux -j$(nproc)
    - cd ..
    - scons platform=linux -j$(nproc)

