image: python3.14

cache:
  key: compiled-bindings
  paths:
    - godot-cpp/bin/

variables:
  GIT_SUBMODULE_STRATEGY: recursive

build_project:
  stage: build
  script:
    - git submodule update --init --recursive
    - pip install scons
    - cd godot-cpp
    - scons platform=linux -j(nproc)
    - cd ..
    - scons platform=linux -j$(nproc)

